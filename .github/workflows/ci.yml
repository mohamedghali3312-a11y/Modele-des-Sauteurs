name: Vérification Mathématique & Tests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    name: Tests Unitaires Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances système et Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev
          python -m pip install --upgrade pip
          pip install pytest gmpy2

      - name: Exécution des tests unitaires
        run: pytest -v

      - name: Exécution du moteur principal
        run: python jumper_model.py

  lean-proofs:
    name: Vérification Formelle Lean 4
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Compilation et vérification Lean 4
        uses: leanprover/lean-action@v1
        with:
          lake-update: true
