name: Verification Mathematique et Tests CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Tests Unitaires Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev
          python -m pip install --upgrade pip
          pip install pytest gmpy2

      - name: Run pytest
        run: pytest -v

      - name: Run jumper_model
        run: python jumper_model.py

  lean-proofs:
    name: Verification Formelle Lean 4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lean 4 and verify proofs
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.12.0
          
          export PATH="$HOME/.elan/bin:$PATH"
          $HOME/.elan/bin/elan default leanprover/lean4:v4.12.0
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
          $HOME/.elan/bin/lake build

